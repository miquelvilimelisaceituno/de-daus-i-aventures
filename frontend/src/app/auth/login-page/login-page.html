<main class="pagina">
  <h1 class="titol-pagina">Inicia sessió</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-field
      label="Email"
      type="email"
      autocomplete="email"
      formControlName="email"
      [error]="emailError()"
    />
    <app-field
      label="Contrasenya"
      type="password"
      autocomplete="current-password"
      formControlName="password"
      [error]="passwordError()"
    />

    @if (formError(); as message) {
      <p class="error-general" role="alert">{{ message }}</p>
    }

    <button appButton type="submit" class="enviar" [disabled]="pending()">
      {{ pending() ? 'Entrant…' : 'Entra' }}
    </button>
  </form>

  <p class="alternativa">Encara no tens compte? <a routerLink="/register">Crea’n un</a></p>
</main>
