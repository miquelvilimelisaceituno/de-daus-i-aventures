name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# La CI només pot llegir el codi: no pot modificar el repo ni publicar res.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck i tests)
    runs-on: ubuntu-latest
    # Totes les execucions comparteixen dda-test: s'esperen en lloc d'anar alhora.
    concurrency:
      group: dda-test-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (tests i build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npm run build
