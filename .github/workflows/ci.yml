name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# La CI només pot llegir el codi: no pot modificar el repo ni publicar res.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck i tests)
    runs-on: ubuntu-latest
    # Totes les execucions comparteixen dda-test: s'esperen en lloc d'anar alhora.
    concurrency:
      group: dda-test-db
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Tests amb cobertura: si baixa dels mínims de jest.config.js, la CI falla.
      - run: npm run test:coverage
      # El resum surt a la pàgina de l'execució (Summary), també si els tests han fallat.
      - name: Resum de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs "Backend (Jest)" coverage/coverage-summary.json
      - name: Informe HTML de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend (tests i build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Tests amb cobertura: si baixa dels mínims d'angular.json, la CI falla.
      - run: npm run test:coverage
      - name: Resum de cobertura
        if: ${{ !cancelled() }}
        run: node ../.github/scripts/coverage-summary.mjs "Frontend (Vitest)" coverage/frontend/coverage-summary.json
      - name: Informe HTML de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run build
